<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="About Image Compressor">
  <link rel="canonical" href="https://image-compressor-indol-omega.vercel.app/about.html">
  <title>من نحن | ضاغط الصور</title>
  <style>
    :root { --page:#F2F7FF; --surface:#FFF; --text:#1E2A4A; --muted:#5B6F95; --border:#C9DCFF; --primary:#0061FF; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--page); color:var(--text); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif; line-height:1.9; }
    .container { width:min(820px,calc(100% - 32px)); margin:0 auto; }
    header { min-height:76px; display:flex; align-items:center; border-bottom:1px solid var(--border); }
    .brand { color:var(--text); text-decoration:none; font-weight:800; }
    main { margin:48px auto; padding:30px; background:var(--surface); border:1px solid var(--border); border-radius:16px; }
    h1 { margin-top:0; font-size:clamp(1.8rem,5vw,2.5rem); }
    h2 { margin-top:32px; font-size:1.18rem; }
    p, li { color:var(--muted); }
    footer { padding:24px 0 34px; border-top:1px solid var(--border); color:var(--muted); text-align:center; font-size:.85rem; }
    .links { display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:9px; margin-bottom:8px; }
    .links a { color:var(--primary); text-decoration:none; }
    .links a:hover { text-decoration:underline; }
    @media (max-width:520px) { main { margin:28px auto; padding:20px; } }
  </style>
</head>
<body data-page="about">
  <header class="container">
    <a class="brand" href="./" data-i18n="brand">ضاغط الصور</a>
  </header>

  <main class="container">
    <h1 data-i18n="aboutTitle">عن ضاغط الصور</h1>
    <p data-i18n="aboutIntro"></p>

    <h2 data-i18n="whyTitle">لماذا أنشأنا الأداة؟</h2>
    <p data-i18n="whyText"></p>

    <h2 data-i18n="howTitle">كيف تعمل؟</h2>
    <p data-i18n="howText"></p>

    <h2 data-i18n="formatsTitle">الصيغ المدعومة</h2>
    <ul>
      <li data-i18n="jpg"></li>
      <li data-i18n="png"></li>
      <li data-i18n="webp"></li>
    </ul>
  </main>

  <footer class="container">
    <div class="links">
      <a href="./" data-i18n="home">الرئيسية</a>
      <span>·</span>
      <a href="privacy.html" data-i18n="privacy">سياسة الخصوصية</a>
      <span>·</span>
      <a href="terms.html" data-i18n="terms">شروط الاستخدام</a>
    </div>
    <span data-i18n="footer">ضاغط الصور — أداة مجانية لمعالجة الصور محليًا</span>
  </footer>

  <script src="legal.js"></script>
</body>
</html>
